  <text x="916" y="163" fill="#475569" font-family="monospace" font-size="12">agent_msg.py</text>
  <text x="850" y="205" fill="#64748b" font-family="monospace" font-size="12">from drixl import Message</text>
  <text x="850" y="252" fill="#7dd3fc" font-family="monospace" font-size="12">msg = Message.build(</text>
  <text x="850" y="272" fill="#7dd3fc" font-family="monospace" font-size="12">  to="AGT2", fr="AGT1",</text>
  <text x="850" y="292" fill="#7dd3fc" font-family="monospace" font-size="12">  msg_type="REQ",</text>
  <text x="850" y="312" fill="#7dd3fc" font-family="monospace" font-size="12">  actions=["ANLY","XTRCT"]</text>
  <text x="850" y="332" fill="#7dd3fc" font-family="monospace" font-size="12">)</text>
  <text x="850" y="362" fill="#22d3ee" font-family="monospace" font-size="12"># @to:AGT2 @fr:AGT1 @t:REQ</text>
  <text x="850" y="382" fill="#22d3ee" font-family="monospace" font-size="12"># ANLY XTRCT</text>
  <text x="850" y="415" fill="#0891b2" font-family="monospace" font-size="12" opacity="0.5">~25 tokens vs ~120 natural lang</text>
  <text x="850" y="455" fill="#0891b2" font-family="monospace" font-size="13" opacity="0.5">pypi.org/project/drixl</text>
