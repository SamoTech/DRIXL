<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0a0d1c"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0L0 0 0 32" fill="none" stroke="#0f1228" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="4" height="320" fill="url(#acc)"/>
  <!-- token compression viz (right) -->
  <g opacity="0.2" transform="translate(860,60)">
    <!-- verbose block -->
    <rect x="0" y="20" width="170" height="80" rx="6" fill="#1a1a3e" stroke="#6366f1" stroke-width="1.5"/>
    <text x="10" y="45" font-family="monospace" font-size="11" fill="#9ca3af">Hello Agent2, could you</text>
    <text x="10" y="62" font-family="monospace" font-size="11" fill="#9ca3af">please analyze the</text>
    <text x="10" y="79" font-family="monospace" font-size="11" fill="#9ca3af">attached file for me?</text>
    <text x="10" y="96" font-family="monospace" font-size="10" fill="#6366f1">~120 tokens</text>
    <!-- arrow -->
    <text x="188" y="65" font-family="monospace" font-size="24" fill="#6366f1">→</text>
    <!-- compact block -->
    <rect x="220" y="20" width="170" height="80" rx="6" fill="#1a1a3e" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="230" y="48" font-family="monospace" font-size="12" fill="#c4b5fd">@to:AGT2 @fr:AGT1</text>
    <text x="230" y="66" font-family="monospace" font-size="12" fill="#c4b5fd">@t:REQ @p:HIGH</text>
    <text x="230" y="84" font-family="monospace" font-size="12" fill="#a78bfa">ANLY [file.json]</text>
    <text x="230" y="96" font-family="monospace" font-size="10" fill="#a78bfa">~25 tokens ✓</text>
    <!-- savings badge -->
    <rect x="220" y="115" width="170" height="28" rx="14" fill="#6366f1" opacity="0.25"/>
    <text x="305" y="134" font-family="monospace" font-size="13" fill="#a78bfa" text-anchor="middle">80% token savings</text>
  </g>
  <!-- logo: D letterform in circuit style -->
  <g transform="translate(80,88)" filter="url(#glow)">
    <rect x="0" y="0" width="116" height="116" rx="18" fill="#090b1c" stroke="url(#acc)" stroke-width="3"/>
    <!-- D shape -->
    <path d="M28 24 L28 88 L58 88 Q90 88 90 56 Q90 24 58 24 Z" fill="none" stroke="url(#acc)" stroke-width="5" stroke-linejoin="round"/>
    <!-- circuit dots -->
    <circle cx="28" cy="24" r="4" fill="#6366f1"/>
    <circle cx="28" cy="88" r="4" fill="#6366f1"/>
    <circle cx="90" cy="56" r="5" fill="#a78bfa"/>
  </g>
  <!-- wordmark -->
  <text x="222" y="95" font-family="'SF Mono',Consolas,monospace" font-size="14" fill="#6366f1" opacity="0.6" letter-spacing="5">INTER-AGENT PROTOCOL</text>
  <text x="218" y="178" font-family="Arial Black,'Arial Bold',sans-serif" font-size="92" font-weight="900" letter-spacing="-3" fill="#f1f0ff">DRIXL</text>
  <text x="222" y="215" font-family="'SF Mono',Consolas,monospace" font-size="18" fill="#a78bfa" letter-spacing="3" opacity="0.9">COMPRESSED INTER-AGENT COMMUNICATION</text>
  <rect x="220" y="232" width="520" height="2" fill="url(#acc)" opacity="0.5"/>
  <!-- chips -->
  <rect x="222" y="250" width="110" height="28" rx="14" fill="#6366f1" opacity="0.18"/>
  <text x="277" y="269" font-family="monospace" font-size="13" fill="#a78bfa" text-anchor="middle">80% Savings</text>
  <rect x="344" y="250" width="100" height="28" rx="14" fill="#6366f1" opacity="0.18"/>
  <text x="394" y="269" font-family="monospace" font-size="13" fill="#a78bfa" text-anchor="middle">21 Verbs</text>
  <rect x="456" y="250" width="130" height="28" rx="14" fill="#6366f1" opacity="0.18"/>
  <text x="521" y="269" font-family="monospace" font-size="13" fill="#a78bfa" text-anchor="middle">Dual Format</text>
</svg>